version: '3.8'

services:
  app:
    build: .
    container_name: thread-co-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/thread_co_db
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - redis
      - mongodb
      - rabbitmq

  redis:
    image: redis:alpine
    container_name: thread-redis-container
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:latest
    container_name: thread-mongo-container
    ports:
      - "27017:27017"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: thread-rabbitmq-container
    ports:
      - "5672:5672"
      - "15672:15672"
